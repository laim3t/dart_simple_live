# 不依赖作者签名 Secrets 的简易打包（可手动触发）
name: build-unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - feature/marked-user
      - marked-user

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK (unsigned debug/release)
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build Windows
        run: |
          cd simple_live_app
          flutter build windows --release

      - name: Pack Windows zip
        shell: pwsh
        run: |
          $out = "simple_live_app/build/windows/x64/runner/Release"
          if (-not (Test-Path $out)) { $out = "simple_live_app/build/windows/runner/Release" }
          Compress-Archive -Path "$out\*" -DestinationPath "simple_live_windows.zip" -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: simple_live_windows.zip
